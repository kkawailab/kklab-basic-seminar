{%- comment -%} JS が「次回の授業」を判定するための全回データ {%- endcomment -%}
{% assign js_sessions = site.sessions | sort: "number" %}
<script type="application/json" id="sessions-json">[{% for s in js_sessions %}{% assign row = site.data.schedule | where: "number", s.number | first %}{% assign ph = site.data.phases | where: "id", s.phase | first %}{% capture place_label %}{% if row.period == row.room and row.period %}{{ row.period }}{% else %}{{ row.period | default: site.data.course.day_period }}　{% if row.room %}{{ row.room }}{% else %}{{ site.data.course.room }}教室{% endif %}{% endif %}{% endcapture %}{"number":{{ s.number }},"title":{{ s.title | jsonify }},"tag":{{ s.tag | jsonify }},"summary":{{ s.summary | jsonify }},"phase":{{ s.phase }},"phase_name":{{ ph.name | jsonify }},"url":{{ s.url | relative_url | jsonify }},"date":{{ row.date | date: "%Y-%m-%d" | jsonify }},"place":{{ place_label | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]</script>
