# ------------------------------------------------------------
# 基礎演習Ⅱ 授業サイトの設定（Jekyll / GitHub Pages）
# ------------------------------------------------------------
title: 基礎演習Ⅱ
description: 名古屋市立大学 経済学部「基礎演習Ⅱ」（2026年度後期・担当 河合勝彦）の授業サイト。授業計画、各回の内容と資料、生成AI利用ガイド、成績評価の案内。
url: "https://kkawailab.github.io"
baseurl: "/kklab-basic-seminar"
lang: ja
timezone: Asia/Tokyo

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true

permalink: pretty

# 各回のページは _sessions/ に置く（/sessions/ファイル名/ で公開される）
collections:
  sessions:
    output: true
    permalink: /sessions/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: sessions
    values:
      layout: session

# サイトに含めないファイル
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - "*.pdf"
  - シラバス詳細.pdf
  - vendor
  - node_modules
  - .jekyll-cache
