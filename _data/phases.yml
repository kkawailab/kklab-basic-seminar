# 授業の3つのフェーズ。各回ページの phase: に 1 / 2 / 3 を指定して対応づけます。
- id: 1
  name: 探究の基礎
  range: 第1〜5回
  lead: 生成AIを用いたアカデミック・ライティングの高度化を学ぶ。文献探索、構成案の作成、推敲のプロセスにAIをどう組み込むかを実践する。
- id: 2
  name: 実践プロジェクト
  range: 第6〜13回
  lead: 企業との連携による「店舗設計提案プロジェクト」に取り組む。市場分析、ペルソナ設定、空間デザイン、プレゼンテーション資料作成の各工程でAIを活用し、実社会の課題に対する具体的解決策を提案する。
- id: 3
  name: キャリア講習
  range: 第14〜15回
  lead: 12月16日と12月23日に実施。スケジュールを空けておくこと。
